<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MS Rewards Auto-Searcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #141414;
      --border: #262626;
      --accent: #00e5ff;
      --text: #e0e0e0;
      --muted: #737373;
      --green: #4ade80;
      --red: #f87171;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--accent); }

    .status-pill {
      font-size: 10px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .status-pill.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    .status-pill.done {
      color: var(--green);
      border-color: var(--green);
    }

    .main-stats {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .search-box {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
    }
    .points-box {
      width: 70px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .label {
      font-size: 8px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .val {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-mini {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .prog-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .prog-label {
      font-size: 8px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .prog-label span { color: var(--text); }

    .progress-track {
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.4s ease;
    }

    .timer-row {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 12px;
      font-size: 10px;
      color: var(--accent);
    }
    .timer-row.visible { display: flex; }

    .btn {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: var(--accent);
      color: var(--bg);
    }
    .btn-stop {
      border-color: var(--red);
      color: var(--red);
    }
    .btn-stop:hover {
      background: var(--red);
      color: var(--bg);
    }

    .done-banner {
      display: none;
      text-align: center;
      margin-bottom: 12px;
      padding: 6px;
      border: 1px solid var(--green);
      border-radius: 6px;
      color: var(--green);
      font-size: 9px;
    }
    .done-banner.visible { display: block; }

    .footer {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .last-run {
      font-size: 8px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 8px;
    }
    .footer-links {
      font-size: 8px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .footer-links a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">REWARD<span>AS</span></div>
    <div id="statusPill" class="status-pill">IDLE</div>
  </div>

  <div class="main-stats">
    <div class="search-box">
      <div class="label">Current Search</div>
      <div id="termText" class="val">—</div>
    </div>
    <div class="points-box">
      <div class="label">Points</div>
      <div id="pointsVal" class="val">0</div>
    </div>
  </div>

  <div class="progress-mini">
    <div class="prog-item">
      <div class="prog-label">PC <span id="pcCount">0</span>/30</div>
      <div class="progress-track"><div id="pcBar" class="progress-fill"></div></div>
    </div>
    <div class="prog-item">
      <div class="prog-label">Mob <span id="mobileCount">0</span>/30</div>
      <div class="progress-track"><div id="mobileBar" class="progress-fill"></div></div>
    </div>
  </div>

  <div id="doneBanner" class="done-banner">
    Session complete!
  </div>

  <div id="timerRow" class="timer-row">
    Next: <span id="timerVal">0s</span>
  </div>

  <button id="mainBtn" class="btn">Start Session</button>

  <div class="footer">
    <div id="lastRun" class="last-run">Last run: Never</div>
    <div class="footer-links">
      <span>30 PC + 30 Mob</span>
      <a href="https://rewards.microsoft.com" target="_blank">Dashboard ↗</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
